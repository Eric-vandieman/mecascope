<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace professionnel · Mécascope</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f7f7f8;font:16px Arial,sans-serif}header{padding:20px 6vw;border-bottom:1px solid #39312b;color:#ffbd62;font-size:24px;font-weight:bold}main{margin:8vh auto;width:min(92%,440px);padding:26px;background:#15181d;border:1px solid #3c3e43;border-radius:12px}label,input{display:block;width:100%}input,button{font:inherit;border-radius:7px;padding:12px}input{margin:6px 0 18px;background:#090a0c;color:white;border:1px solid #666}button{background:#ffbd62;border:0;margin:0 5px 10px 0;cursor:pointer}h1{font-size:28px}p{line-height:1.5}
</style><header>Mécascope</header><main><h1>Espace professionnel</h1><p>Préproduction privée · Utilisez uniquement des comptes de test.</p><form><label>E-mail professionnel<input name="email" type="email" required autocomplete="email"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password" maxlength="256"></label><button value="login">Se connecter</button><button value="signup">Créer un compte</button></form><p role="status"></p></main><section hidden id="espace"><h2>Mes établissements</h2><ul id="sites"></ul><form id="entreprise"><label>Raison sociale<input name="nom" maxlength="200" required></label><label>SIRET du premier établissement<input name="siret" pattern="[0-9]{14}" inputmode="numeric" required></label><button>Enregistrer mon entreprise</button></form><button type="button" id="sortir">Se déconnecter</button></section><script src="/session.js"></script></html>
