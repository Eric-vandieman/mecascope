<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mission — Mécascope</title><link rel="icon" type="image/webp" sizes="192x192" href="/logo-ms-officiel.webp?v=ms-20261125"><link rel="shortcut icon" href="/logo-ms-officiel.webp?v=ms-20261125"><link rel="stylesheet" href="/site.css"><style>body{background:#131b24;color:#f4f1ec;font:16px Arial}.mission{max-width:690px;margin:45px auto;padding:30px;border:1px solid #725431;border-radius:18px;background:#202b37}h1{color:#efac64}button{border:0;padding:16px 24px;background:#ed932d;border-radius:8px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#bac5d1}#etat{line-height:1.6}#erreur{color:#edc48c}</style></head><body><main class="mission"><a href="/" style="color:#edb16b">← Mécascope</a><h1>Votre mission de recherche</h1><p id="etat" role="status">Chargement du dossier…</p><p id="offre"></p><p id="conditions" class="muted"></p><button id="payer" hidden>Accepter et payer</button><p id="erreur" role="alert"></p><p class="muted">Lien personnel : ne le partagez pas. Le retour du navigateur ne confirme pas le paiement. Seul Stripe confirme les fonds au serveur.</p></main><script>
(async()=>{
 const qs=new URLSearchParams(location.search),token=qs.get('t'),etat=document.getElementById('etat'),payer=document.getElementById('payer'),offre=document.getElementById('offre'),conditions=document.getElementById('conditions'),erreur=document.getElementById('erreur');
 if(!token||!(/^[0-9a-f]{64}$/i.test(token))){etat.textContent='Lien manquant ou incorrect.';return}
 async function refresh(){
  try{
   const r=await fetch('/api/unitaire?action=status&t='+encodeURIComponent(token),{cache:'no-store'});
   const data=await r.json();if(!r.ok)throw Error(data.message||'Dossier inaccessible');
   payer.hidden=true;offre.textContent='Référence : '+data.reference+(data.offre?' — '+data.offre:'');
   if(data.statut==='devis_envoye'){
    etat.textContent='Proposition : '+data.total+' € au total, dont '+data.initial+' € à régler pour lancer la recherche après votre accord. Solde : '+data.solde+' € seulement si une source conforme est trouvée.';
    const add=(data.expressOption?' Express '+data.expressOption+' : supplément de '+(data.expressOption==='24h'?50:20)+' € uniquement si le délai convenu est respecté.':'')+(data.reservationOption?' Réservation fournisseur : 10 € uniquement si confirmée.':'');
    conditions.textContent='Vous acceptez les éventuels suppléments conditionnels indiqués dans le devis :'+(add||' aucun supplément.')+' Le paiement initial se fait sur Stripe après votre confirmation.';
    payer.hidden=false;payer.dataset.stage='initial';payer.textContent="J’accepte et je règle "+data.initial+" €";
   }else if(data.statut==='reussite'){
    etat.textContent='Mécascope a identifié une source conforme. Vous pouvez régler le solde de '+data.solde+' €.';
    conditions.textContent='Le solde ne vous est proposé qu’après vérification de la source.';
    payer.hidden=false;payer.dataset.stage='solde';payer.textContent="Régler le solde de "+data.solde+" €";
   }else if(data.statut==='acompte_paye')etat.textContent="Acompte confirmé, recherche en cours. Aucun solde n'est dû pour le moment.";
   else if(data.statut==='solde_paye')etat.textContent='Solde confirmé. Mécascope finalise la transmission des informations.';
   else if(data.statut==='echec')etat.textContent="Recherche infructueuse. Aucun solde à payer.";
   else etat.textContent='Demande reçue, étude en cours.';
  }catch(e){etat.textContent=e.message}
 }
 payer.onclick=async()=>{
  payer.disabled=true;erreur.textContent='Préparation du paiement…';
  try{
   const r=await fetch('/api/unitaire',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'checkout',stage:payer.dataset.stage,token})});
   const d=await r.json();if(!r.ok)throw Error(d.message||'Paiement indisponible');
   const u=new URL(d.checkoutUrl);if(u.protocol!=='https:'||!u.hostname.endsWith('.stripe.com'))throw Error('Lien Stripe non reconnu');location.assign(u.href);
  }catch(e){erreur.textContent=e.message;payer.disabled=false}
 };
 await refresh();
 if(qs.get('paiement')==='retour'){erreur.textContent='Retour de Stripe reçu. Confirmation du paiement en cours.';setTimeout(refresh,3000)}
})();
</script><script src="/mission-chat.js?v=20261125-r2" defer></script></body></html>
